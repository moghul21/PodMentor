name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t podmentor:smoke .

      - name: Run standalone container
        run: |
          docker run -d --name podmentor-app -p 8000:8000 -e ENVIRONMENT=ci podmentor:smoke

      - name: Wait for standalone health check
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Standalone container healthy on attempt $i"
              break
            fi
            echo "Waiting for container ($i/30)..."
            sleep 1
          done
          curl -f -s http://localhost:8000/health | grep -i "ok"

      - name: Dump standalone logs on failure
        if: failure()
        run: docker logs podmentor-app || true

      - name: Stop standalone container
        run: docker rm -f podmentor-app

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Verify Docker Compose services and endpoints
        run: |
          echo "Waiting for Docker Compose services..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Compose API healthy on attempt $i"
              break
            fi
            echo "Waiting for Compose stack ($i/30)..."
            sleep 2
          done

          # Health check
          curl -f -s http://localhost:8000/health | grep -i "ok"

          # Chat endpoint smoke check (mock mode in CI)
          curl -f -s -X POST http://localhost:8000/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "Where is the scheduler defined?"}' | grep -i "model_used"

          # Usage tracking smoke check
          curl -f -s http://localhost:8000/usage | grep -i "total_requests"

      - name: Dump Compose logs if failed
        if: failure()
        run: docker compose logs

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v
